[package]
name = "lorawan-gateway-health"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Prometheus exporter for LoRaWAN gateway health: a UDP tap on the Semtech packet-forwarder protocol"
license = "MIT"
repository = "https://github.com/VB-Builds/lorawan-gateway-health"
readme = "README.md"
publish = false

[lib]
name = "lgh"
path = "src/lib.rs"

[[bin]]
name = "lgh-exporter"
path = "src/main.rs"

[[bin]]
name = "lgh-replay"
path = "src/bin/replay.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
